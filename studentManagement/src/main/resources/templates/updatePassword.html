<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Academia</title>
    
    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#f6f8fc] text-[#202124] min-h-screen flex items-center justify-center font-sans p-4">

    <!-- Card Container -->
    <div class="w-full max-w-[448px] bg-white border border-[#dadce0] p-8 sm:p-10 rounded-2xl shadow-[0_1px_3px_0_rgba(60,64,67,0.15),0_4px_8px_3px_rgba(60,64,67,0.08)]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-[#e8f0fe] border border-[#d2e3fc] text-[#1a73e8] rounded-2xl mb-4 shadow-sm">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m-3.414-1.414A2 2 0 1119 4a2 2 0 01-3.414 1.586m-5.172 5.172L3 18v3h3l8.586-8.586m-5.172-5.172L9 9l3 3-1.586 1.586"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-[#202124] tracking-tight" th:utext="#{message.resetYourPassword}">Reset Password</h1>
            <p class="text-sm text-[#5f6368] mt-1">Please enter your new password below</p>
        </div>

        <!-- Alert Notification for Errors -->
        <div id="globalError" class="hidden mb-5 p-3.5 bg-[#fce8e6] border border-[#fad2cf] text-[#c5221f] text-xs rounded-xl flex items-center gap-2">
            <svg class="w-5 h-5 text-[#d93025] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="errorText">Error details</span>
        </div>

        <!-- Form -->
        <form id="updatePasswordForm" class="space-y-5">
            <input type="hidden" id="token" name="token" th:value="${param.token}" />

            <!-- New Password -->
            <div>
                <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-2">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#80868b]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="newPassword" 
                           class="w-full bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                           placeholder="Enter new password" required minlength="8">
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-2">Confirm Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#80868b]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </span>
                    <input type="password" id="matchPassword" 
                           class="w-full bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                           placeholder="Confirm new password" required minlength="8">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-[#1a73e8] hover:bg-[#174ea6] text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-sm hover:shadow-md mt-6 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span th:utext="#{message.updatePassword}">Update Password</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-xs text-[#5f6368] border-t border-[#e0e2e7] pt-6">
            <a th:href="@{/login}" class="text-[#1a73e8] hover:underline font-semibold transition">Back to sign in</a>
        </div>

    </div>

    <!-- Script to execute fetch with CSRF -->
    <script th:inline="javascript">
        const serverContext = [[@{/}]];
        
        const passwordInput = document.getElementById("password");
        const matchInput = document.getElementById("matchPassword");
        const errorDiv = document.getElementById("globalError");
        const errorText = document.getElementById("errorText");

        function checkPasswordsMatch() {
            if (passwordInput.value !== matchInput.value && matchInput.value !== "") {
                errorDiv.classList.remove("hidden");
                errorText.textContent = "Passwords do not match!";
                return false;
            } else {
                errorDiv.classList.add("hidden");
                return true;
            }
        }

        passwordInput.addEventListener("keyup", checkPasswordsMatch);
        matchInput.addEventListener("keyup", checkPasswordsMatch);

        document.getElementById("updatePasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();

            if (!checkPasswordsMatch()) {
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Saving...`;

            const password = passwordInput.value;
            const token = document.getElementById("token").value;
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            fetch(serverContext + "user/savePassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({ newPassword: password, token: token })
            })
            .then(async response => {
                const data = await response.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                if (!response.ok) {
                    throw new Error(data.message || "Reset failed");
                }

                // Success
                window.location.href = serverContext + "login?message=" + encodeURIComponent(data.message);
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                errorDiv.classList.remove("hidden");
                errorText.textContent = error.message;
            });
        });
    </script>
</body>
</html>
