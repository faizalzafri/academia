<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACADEMIA Academy Chat - Socket Room</title>
    
    <!-- SockJS and Stomp via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Custom CSS styles for dynamically added chat messages -->
    <style>
        .event-message {
            text-align: center;
            color: #5f6368;
            font-size: 0.75rem;
            margin: 8px 0;
            font-style: italic;
        }
        .chat-message {
            padding: 10px 14px;
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            margin: 8px 0;
            font-size: 0.875rem;
            color: #202124;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.08);
        }
        .nickname {
            display: block;
            color: #1a73e8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-[#f6f8fc] text-[#202124] min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-[#dadce0] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#e8f0fe] text-[#1a73e8] rounded-xl flex items-center justify-center border border-[#d2e3fc]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-lg tracking-wider text-[#1a73e8]">ACADEMIA CHAT ROOM</span>
                </div>
                <div class="flex gap-4">
                    <a th:href="${#authorization.expression('hasAuthority(''TEACHER'')') ? '/home' : '/student/home'}" 
                       class="px-3.5 py-2 text-xs font-semibold bg-white hover:bg-[#f1f3f4] border border-[#dadce0] rounded-lg transition text-[#1a73e8] flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Exit Chat
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 flex flex-col min-h-0">
        
        <!-- Chat Area Card -->
        <div class="bg-white border border-[#dadce0] rounded-2xl shadow-sm overflow-hidden flex flex-col flex-1 min-h-0">
            
            <!-- Chat Card Header -->
            <div class="px-6 py-4 bg-[#f8fafd] border-b border-[#e0e2e7] flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-[#1e8e3e] rounded-full animate-pulse"></span>
                    <h2 class="text-xs font-bold text-[#5f6368] uppercase tracking-wider">Active Room Session</h2>
                </div>
                <div class="text-right text-xs text-[#5f6368]">
                    Logged in as: <span id="username" class="font-bold text-[#1a73e8]" th:utext="${username}">student1</span>
                </div>
            </div>

            <!-- Connecting notice -->
            <div id="connecting" class="p-3 bg-[#e8f0fe] border-b border-[#d2e3fc] text-[#1a73e8] text-center text-xs font-semibold flex items-center justify-center gap-2">
                <svg class="w-4 h-4 animate-spin text-[#1a73e8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12"></path>
                </svg>
                <span>Connecting to WebSocket server...</span>
            </div>

            <!-- Messages lists -->
            <ul id="messageArea" class="flex-1 overflow-y-auto p-6 space-y-4 min-h-[300px] bg-[#f6f8fc]">
                <!-- Messages appended dynamically -->
            </ul>

            <!-- Message Form Input -->
            <form id="messageForm" name="messageForm" class="p-4 border-t border-[#e0e2e7] bg-white">
                <div class="flex gap-3">
                    <input type="text" id="message" autocomplete="off"
                           class="flex-1 bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                           placeholder="Type a message..." required>
                    <button type="submit" class="px-5 py-2.5 bg-[#1a73e8] hover:bg-[#174ea6] text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm hover:shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        <span class="hidden sm:inline">Send</span>
                    </button>
                </div>
            </form>

        </div>

    </main>

    <!-- Execute chat.js connection logic -->
    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
