databaseChangeLog:
  - changeSet:
      id: 06-create-activities-table
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: activities
      changes:
        - createTable:
            tableName: activities
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: category
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: academic_year_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_activities_academic_year
                    references: academic_years(id)
              - column:
                  name: eventDate
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: registrationDeadline
                  type: date
              - column:
                  name: venue
                  type: varchar(100)
              - column:
                  name: status
                  type: varchar(25)
                  defaultValue: "PLANNING"
                  constraints:
                    nullable: false
              - column:
                  name: coordinator_username
                  type: varchar(20)
                  constraints:
                    foreignKeyName: fk_activities_coordinator
                    references: users(username)

  - changeSet:
      id: 06-create-activity-participants-table
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: activity_participants
      changes:
        - createTable:
            tableName: activity_participants
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: activity_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_activity_participants_activity
                    references: activities(id)
              - column:
                  name: student_username
                  type: varchar(20)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_activity_participants_student
                    references: users(username)
              - column:
                  name: role
                  type: varchar(50)
                  defaultValue: "Participant"
              - column:
                  name: teamName
                  type: varchar(100)
              - column:
                  name: position
                  type: varchar(50)
              - column:
                  name: remarks
                  type: varchar(250)
              - column:
                  name: registeredAt
                  type: timestamp

  - changeSet:
      id: 06-create-activity-results-table
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: activity_results
      changes:
        - createTable:
            tableName: activity_results
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: activity_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_activity_results_activity
                    references: activities(id)
              - column:
                  name: eventName
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: winnerName
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: winnerClass
                  type: varchar(50)
              - column:
                  name: position
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: varchar(50)
