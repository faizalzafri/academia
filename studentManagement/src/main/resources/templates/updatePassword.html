<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Academia</title>
    
    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-[#020617] via-[#0f172a] to-[#1e293b] text-[#f8fafc] min-h-screen flex items-center justify-center font-sans p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-[#1e293b]/70 border border-slate-700/60 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-500/10 border border-teal-500/30 text-teal-400 rounded-full mb-4">
                <!-- Inline SVG: Key -->
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m-3.414-1.414A2 2 0 1119 4a2 2 0 01-3.414 1.586m-5.172 5.172L3 18v3h3l8.586-8.586m-5.172-5.172L9 9l3 3-1.586 1.586"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight" th:utext="#{message.resetYourPassword}">Reset Password</h1>
            <p class="text-sm text-slate-400 mt-1">Please enter your new credentials below</p>
        </div>

        <!-- Alert Notification for Errors -->
        <div id="globalError" class="hidden mb-5 p-3.5 bg-rose-955/60 border border-rose-500/50 text-rose-200 text-sm rounded-xl flex items-center gap-2">
            <svg class="w-5 h-5 text-rose-450" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="errorText">Error details</span>
        </div>

        <!-- Form -->
        <form id="updatePasswordForm" class="space-y-5">
            <input type="hidden" id="token" name="token" th:value="${param.token}" />

            <!-- New Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <!-- Inline SVG: Lock -->
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="newPassword" 
                           class="w-full bg-slate-900/60 border border-slate-700 focus:border-teal-500 text-white pl-10 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-teal-500 transition" 
                           placeholder="Enter new password" required minlength="8">
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Confirm Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <!-- Inline SVG: Double Check -->
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </span>
                    <input type="password" id="matchPassword" 
                           class="w-full bg-slate-900/60 border border-slate-700 focus:border-teal-500 text-white pl-10 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-teal-500 transition" 
                           placeholder="Confirm new password" required minlength="8">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-teal-555/10 mt-6 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span th:utext="#{message.updatePassword}">Update Password</span>
            </button>
        </form>

    </div>

    <!-- Script to execute fetch with CSRF -->
    <script th:inline="javascript">
        const serverContext = [[@{/}]];
        
        const passwordInput = document.getElementById("password");
        const matchInput = document.getElementById("matchPassword");
        const errorDiv = document.getElementById("globalError");
        const errorText = document.getElementById("errorText");

        function checkPasswordsMatch() {
            if (passwordInput.value !== matchInput.value && matchInput.value !== "") {
                errorDiv.classList.remove("hidden");
                errorText.textContent = "Passwords do not match!";
                return false;
            } else {
                errorDiv.classList.add("hidden");
                return true;
            }
        }

        passwordInput.addEventListener("keyup", checkPasswordsMatch);
        matchInput.addEventListener("keyup", checkPasswordsMatch);

        document.getElementById("updatePasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();

            if (!checkPasswordsMatch()) {
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Saving...`;

            const password = passwordInput.value;
            const token = document.getElementById("token").value;
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            fetch(serverContext + "user/savePassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({ newPassword: password, token: token })
            })
            .then(async response => {
                const data = await response.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                if (!response.ok) {
                    throw new Error(data.message || "Reset failed");
                }

                // Success
                window.location.href = serverContext + "login?message=" + encodeURIComponent(data.message);
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                errorDiv.classList.remove("hidden");
                errorText.textContent = error.message;
            });
        });
    </script>
</body>
</html>
