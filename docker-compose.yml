version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: academiaDb
    environment:
      POSTGRES_DB: academiaDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
