<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Academia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#f6f8fc] text-[#202124] min-h-screen font-sans">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-[#dadce0] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#e8f0fe] text-[#1a73e8] rounded-xl flex items-center justify-center border border-[#d2e3fc]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-lg tracking-wider text-[#1a73e8]">ACADEMIA</span>
                </div>
                <div class="flex gap-4">
                    <a th:href="@{/home}" 
                       class="px-4 py-2 text-xs font-semibold bg-white hover:bg-[#f1f3f4] border border-[#dadce0] text-[#1a73e8] rounded-lg transition flex items-center gap-2">
                        <svg class="w-4 h-4 text-[#1a73e8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Success Alert -->
        <div th:if="${param.success}" class="mb-6 p-4 bg-[#e6f4ea] border border-[#ceead6] text-[#137333] text-xs rounded-xl flex items-center gap-3">
            <svg class="w-5 h-5 text-[#1e8e3e] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Profile description successfully updated!</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Left Avatar & Status Card -->
            <div class="bg-white border border-[#dadce0] p-6 rounded-2xl shadow-sm text-center space-y-4 h-fit">
                <div class="relative w-24 h-24 mx-auto bg-[#e8f0fe] border border-[#d2e3fc] text-[#1a73e8] rounded-full flex items-center justify-center">
                    <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="absolute bottom-0 right-1 w-4 h-4 bg-[#1e8e3e] border-2 border-white rounded-full"></span>
                </div>
                
                <div>
                    <h2 class="text-lg font-bold text-[#202124]" th:text="${user.name}">John Doe</h2>
                    <span class="px-2.5 py-0.5 bg-[#e8f0fe] text-[#1a73e8] border border-[#d2e3fc] rounded-full text-xs font-semibold uppercase tracking-wider mt-1 inline-block" 
                          th:text="${u.authorities != null and u.authorities.contains('TEACHER') ? 'Faculty' : 'Student'}">Student</span>
                </div>

                <div class="border-t border-[#e0e2e7] pt-4 text-left space-y-2 text-xs text-[#5f6368]">
                    <div class="flex justify-between">
                        <span>Username:</span>
                        <span class="text-[#202124] font-semibold" th:text="${user.userName}">username</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Department:</span>
                        <span class="text-[#202124] font-semibold" th:text="${user.department}">Engineering</span>
                    </div>
                </div>
            </div>

            <!-- Right Detail & Edit Form Card -->
            <div class="md:col-span-2 bg-white border border-[#dadce0] p-8 rounded-2xl shadow-sm space-y-6">
                <h3 class="text-base font-bold text-[#202124] border-b border-[#e0e2e7] pb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-[#1a73e8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Account Profile Details
                </h3>

                <form th:action="@{/user/account}" th:object="${user}" method="post" class="space-y-4">
                    <input type="hidden" th:field="*{userName}">
                    <input type="hidden" th:field="*{name}">
                    <input type="hidden" th:field="*{department}">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-2">Registration Name</label>
                            <input type="text" th:value="${user.name}" class="w-full bg-[#f1f3f4] border border-[#dadce0] text-[#5f6368] rounded-xl p-2.5 text-sm cursor-not-allowed" disabled>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-2">Email Address</label>
                            <input type="email" th:value="${user.email}" class="w-full bg-[#f1f3f4] border border-[#dadce0] text-[#5f6368] rounded-xl p-2.5 text-sm cursor-not-allowed" disabled>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-2">Self description / Bio</label>
                        <textarea th:field="*{description}" rows="4" required
                                  class="w-full bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                                  placeholder="Introduce yourself to other class members..."></textarea>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-[#e0e2e7]">
                        <button type="submit" class="px-6 py-2.5 bg-[#1a73e8] hover:bg-[#174ea6] text-white rounded-xl text-sm font-semibold transition shadow-sm hover:shadow-md flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Save Profile
                        </button>
                    </div>
                </form>
            </div>

        </div>

    </main>
</body>
</html>
