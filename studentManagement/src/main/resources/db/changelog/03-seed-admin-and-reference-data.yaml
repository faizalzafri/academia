                  name: users_username
                  value: "admin"
              - column:
                  name: authorities
                  value: "PRINCIPAL"
        - insert:
            tableName: authorities
            columns:
              - column:
                  name: users_username
                  value: "admin"
              - column:
                  name: authorities
                  value: "USER"

