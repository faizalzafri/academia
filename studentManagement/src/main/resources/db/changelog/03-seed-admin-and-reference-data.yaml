databaseChangeLog:
  - changeSet:
      id: 03-seed-system-admin
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT count(*) FROM users WHERE username = 'admin'"
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: "admin"
              - column:
                  name: user_type
                  value: "user"
              - column:
                  name: password
                  value: "$2a$10$slYQmyNdGzTn7ZLBXBChFOC9f6kFjAqPhccnP6DxlWXx2lPk1C3G6" # Password123
              - column:
                  name: enabled
                  valueBoolean: true
                  type: boolean
              - column:
                  name: email
                  value: "admin@academia.edu"
              - column:
                  name: description
                  value: "System Administrator Account"
              - column:
                  name: approval_status
                  value: "APPROVED"
        - insert:
            tableName: authorities
            columns:
              - column:
                  name: users_username
                  value: "admin"
              - column:
                  name: authorities
                  value: "SYSTEM_ADMIN"
        - insert:
            tableName: authorities
            columns:
              - column:
                  name: users_username
                  value: "admin"
              - column:
                  name: authorities
                  value: "TEACHER"
        - insert:
