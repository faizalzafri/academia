databaseChangeLog:
  - changeSet:
      id: 04-create-academic-years-table
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: academic_years
      changes:
        - createTable:
            tableName: academic_years
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: startDate
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: endDate
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: "PLANNING"
                  constraints:
                    nullable: false
              - column:
                  name: createdAt
                  type: timestamp
              - column:
                  name: completedAt
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(20)
                  constraints:
                    foreignKeyName: fk_academic_years_created_by
                    references: users(username)

  - changeSet:
      id: 04-seed-default-academic-year
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT count(*) FROM academic_years"
      changes:
        - insert:
            tableName: academic_years
            columns:
              - column:
                  name: name
                  value: "2026-2027"
              - column:
                  name: startDate
                  valueDate: "2026-04-01"
              - column:
                  name: endDate
                  valueDate: "2027-03-31"
              - column:
                  name: status
                  value: "ACTIVE"
              - column:
                  name: createdAt
                  valueDate: "2026-04-01T00:00:00"

  - changeSet:
      id: 04-add-academic-year-fk-to-class-sections
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: class_sections
                columnName: academic_year_id
      changes:
        - addColumn:
            tableName: class_sections
            columns:
              - column:
                  name: academic_year_id
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    foreignKeyName: fk_class_sections_academic_year
                    references: academic_years(id)

  - changeSet:
      id: 04-add-academic-year-fk-to-timetable-slots
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: timetable_slots
                columnName: academic_year_id
      changes:
        - addColumn:
            tableName: timetable_slots
            columns:
              - column:
                  name: academic_year_id
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    foreignKeyName: fk_timetable_slots_academic_year
                    references: academic_years(id)

  - changeSet:
      id: 04-add-academic-year-fk-to-school-calendar-events
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: school_calendar_events
                columnName: academic_year_id
      changes:
        - addColumn:
            tableName: school_calendar_events
            columns:
              - column:
                  name: academic_year_id
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    foreignKeyName: fk_school_calendar_events_academic_year
                    references: academic_years(id)
