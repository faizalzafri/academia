<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Course Catalog - Academia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#f6f8fc] text-[#202124] min-h-screen font-sans">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-[#dadce0] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#e8f0fe] text-[#1a73e8] rounded-xl flex items-center justify-center border border-[#d2e3fc]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-lg tracking-wider text-[#1a73e8]">ACADEMIA STUDENT PORTAL</span>
                </div>
                <div class="flex gap-4">
                    <a th:href="@{/student/home}" class="px-3.5 py-2 text-xs font-semibold bg-white hover:bg-[#f1f3f4] border border-[#dadce0] rounded-lg transition text-[#1a73e8] flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Page Title -->
        <div class="bg-white border border-[#dadce0] p-6 rounded-2xl shadow-sm mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-[#202124] tracking-tight">Active Course Catalog</h1>
                <p class="mt-1 text-sm text-[#5f6368]">Browse current curricula, review course descriptions, and access student study documents</p>
            </div>
            
            <a th:href="@{/chat}" class="px-4 py-2 bg-[#1a73e8] hover:bg-[#174ea6] text-white rounded-xl text-xs font-semibold transition shadow-sm hover:shadow-md flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                Launch Chatroom
            </a>
        </div>

        <!-- Course Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <th:block th:each="c : ${courses}">
                <div class="bg-white border border-[#dadce0] rounded-2xl shadow-sm overflow-hidden hover:border-[#1a73e8] transition flex flex-col justify-between">
                    
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-start gap-4">
                            <span class="px-2.5 py-0.5 bg-[#e8f0fe] text-[#1a73e8] border border-[#d2e3fc] rounded-full text-[10px] font-bold uppercase tracking-wider" th:text="${c.code}">MATH101</span>
                            <span class="text-xs text-[#5f6368] font-semibold" th:text="${c.credit} + ' Credits'">3 Credits</span>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-bold text-[#202124] tracking-tight" th:text="${c.name}">Introduction to Calculus</h3>
                            <p class="text-xs text-[#5f6368] mt-2 leading-relaxed line-clamp-3" th:text="${c.description ?: 'No syllabus description provided for this course section.'}"></p>
                        </div>
                    </div>

                    <div class="p-4 border-t border-[#e0e2e7] bg-[#f8fafd] flex justify-between items-center">
                        <div class="text-xs text-[#5f6368] flex items-center gap-1 font-mono">
                            <svg class="w-4 h-4 text-[#80868b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span th:text="${c.code != null ? c.code : 'Faculty'}">Faculty</span>
                        </div>
                        
                        <a th:href="@{/student/course/{id}(id=${c.id})}" 
                           class="px-3.5 py-1.5 text-xs font-semibold bg-[#1a73e8] hover:bg-[#174ea6] text-white rounded-lg transition shadow-sm flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            View Syllabus
                        </a>
                    </div>

                </div>
            </th:block>
        </div>

    </main>
</body>
</html>
