<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Academia</title>
    
    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-[#020617] via-[#0f172a] to-[#1e293b] text-[#f8fafc] min-h-screen flex items-center justify-center font-sans p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-[#1e293b]/70 border border-slate-700/60 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-500/10 border border-teal-500/30 text-teal-400 rounded-full mb-4">
                <!-- Inline SVG: Lock -->
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Forgot Password?</h1>
            <p class="text-sm text-slate-400 mt-1">Enter your email below to reset your password</p>
        </div>

        <!-- Alert Notification for Status -->
        <div id="statusAlert" class="hidden mb-5 p-3.5 text-sm rounded-xl flex items-center gap-2">
            <!-- Icon placeholder will be handled via JS toggle or simple SVGs -->
            <span id="alertMessage">Status details</span>
        </div>

        <!-- Form -->
        <form id="forgotPasswordForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <!-- Inline SVG: Envelope -->
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L22 8m-9 11h-3a2 2 0 01-2-2V8.67l-3.33-2.22A2 2 0 002 8.11v8.88a2 2 0 002 2h16a2 2 0 002-2V8.11a2 2 0 00-1-1.67l-3.33 2.22V17a2 2 0 01-2 2z"></path>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" 
                           class="w-full bg-slate-900/60 border border-slate-700 focus:border-teal-500 text-white pl-10 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-teal-500 transition" 
                           placeholder="you@example.com" required autocomplete="off">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-teal-550/10 mt-6 flex items-center justify-center gap-2">
                <!-- Inline SVG: Paper Plane -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span>Send Reset Link</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-sm text-slate-400 border-t border-slate-800 pt-6">
            Remembered your credentials? 
            <a th:href="@{/login}" class="text-teal-400 hover:text-teal-300 font-semibold transition ml-1">Sign In</a>
        </div>

    </div>

    <!-- Script to execute fetch with CSRF -->
    <script th:inline="javascript">
        const serverContext = [[@{/}]];

        document.getElementById("forgotPasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Sending...`;

            const email = document.getElementById("email").value;
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            
            const alertDiv = document.getElementById("statusAlert");
            const alertMessage = document.getElementById("alertMessage");

            fetch(serverContext + "resetPassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({ email: email })
            })
            .then(async response => {
                const data = await response.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                if (!response.ok) {
                    throw new Error(data.message || "Something went wrong");
                }
                
                // Success
                window.location.href = serverContext + "login?message=" + encodeURIComponent(data.message);
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;

                alertDiv.className = "mb-5 p-3.5 bg-rose-955/60 border border-rose-500/50 text-rose-200 text-sm rounded-xl flex items-center gap-2";
                alertMessage.textContent = error.message;
            });
        });
    </script>
</body>
</html>
