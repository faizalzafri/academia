<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.signIn} + ' - ' + #{app.title}">Sign in - Academia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter / Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f6f8fc] text-[#202124] min-h-screen flex flex-col items-center justify-center font-sans p-4 space-y-4">

    <!-- Language Selector Pill -->
    <div class="flex items-center gap-1.5 bg-white border border-[#dadce0] rounded-2xl px-3 py-1.5 shadow-sm text-xs font-semibold text-[#5f6368]">
        <svg class="w-4 h-4 text-[#1a73e8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
        </svg>
        <span th:text="#{nav.language}">Language</span>:
        <a th:href="@{/login(lang='en')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'en' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">EN</a>
        <span class="text-[#dadce0]">&bull;</span>
        <a th:href="@{/login(lang='es')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'es' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">ES</a>
        <span class="text-[#dadce0]">&bull;</span>
        <a th:href="@{/login(lang='fr')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'fr' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">FR</a>
        <span class="text-[#dadce0]">&bull;</span>
        <a th:href="@{/login(lang='de')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'de' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">DE</a>
        <span class="text-[#dadce0]">&bull;</span>
        <a th:href="@{/login(lang='hi')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'hi' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">HI</a>
        <span class="text-[#dadce0]">&bull;</span>
        <a th:href="@{/login(lang='ar')}" class="px-2 py-0.5 rounded-lg hover:bg-[#e8f0fe] hover:text-[#1a73e8] transition" th:classappend="${#locale.language == 'ar' ? 'bg-[#e8f0fe] text-[#1a73e8] font-bold' : ''}">AR</a>
    </div>

    <!-- Login Card Container -->
    <div class="w-full max-w-[448px] bg-white border border-[#dadce0] p-8 sm:p-10 rounded-2xl shadow-[0_1px_3px_0_rgba(60,64,67,0.15),0_4px_8px_3px_rgba(60,64,67,0.08)]">
        
        <!-- Logo and Heading -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-[#e8f0fe] border border-[#d2e3fc] text-[#1a73e8] rounded-2xl mb-4 shadow-sm">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-[#202124] tracking-tight" th:text="#{auth.welcomeBack}">Welcome back</h1>
            <p class="text-sm text-[#5f6368] mt-1" th:text="#{auth.loginSubtitle}">Sign in with your institutional credentials</p>
        </div>

        <!-- Alert Notification for Pending Approval Registration -->
        <div th:if="${param.pendingApproval != null}" class="mb-5 p-4 bg-[#fef7e0] border border-[#feefc3] text-[#b06000] text-xs rounded-xl flex items-start gap-2.5">
            <svg class="w-5 h-5 text-[#f29900] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <p class="font-bold text-[#b06000]" th:text="#{auth.registeredSuccess}">Registration Submitted!</p>
            </div>
        </div>

        <!-- Alert Notification for Errors -->
        <div th:if="${param.error != null}" class="mb-5 p-3.5 bg-[#fce8e6] border border-[#fad2cf] text-[#c5221f] text-xs rounded-xl flex items-center gap-2">
            <svg class="w-5 h-5 text-[#d93025] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span th:text="#{message.badCredentials}">Invalid credentials, or your account is pending administrator activation.</span>
        </div>

        <!-- Alert Notification for Logout -->
        <div th:if="${param.logout != null}" class="mb-5 p-3.5 bg-[#e6f4ea] border border-[#ceead6] text-[#137333] text-xs rounded-xl flex items-center gap-2">
            <svg class="w-5 h-5 text-[#1e8e3e] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span th:text="#{message.logoutSucc}">You have signed out successfully.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" name="f" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider mb-1.5" th:text="#{auth.usernameOrEmail}">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#80868b]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </span>
                    <input type="text" name="username" id="username" 
                           class="w-full bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                           th:placeholder="#{auth.usernameOrEmail}" required autocomplete="off">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-bold text-[#5f6368] uppercase tracking-wider" th:text="#{auth.password}">Password</label>
                    <a th:href="@{/forgotPassword}" class="text-xs text-[#1a73e8] hover:underline font-medium transition" th:text="#{auth.forgotPassword}">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#80868b]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </span>
                    <input type="password" name="password" id="password" 
                           class="w-full bg-white border border-[#dadce0] focus:border-[#1a73e8] text-[#202124] pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#e8f0fe] transition placeholder-[#80868b]" 
                           placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#1a73e8] hover:bg-[#174ea6] text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-sm hover:shadow-md mt-6" th:text="#{auth.signIn}">
                Sign In
            </button>
        </form>

        <!-- Footer / Registration Link -->
        <div class="mt-8 text-center text-xs text-[#5f6368] border-t border-[#e0e2e7] pt-5">
            <span th:text="#{auth.noAccount}">Don't have an account?</span>
            <a th:href="@{/register}" class="text-[#1a73e8] hover:underline font-semibold transition ml-1" th:text="#{auth.createAccount}">Create account</a>
        </div>

    </div>

</body>
</html>
