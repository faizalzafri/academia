databaseChangeLog:
  - changeSet:
      id: 05-create-student-enrollments-table
      author: academia
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: student_enrollments
      changes:
        - createTable:
            tableName: student_enrollments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_username
                  type: varchar(20)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_student_enrollments_student
                    references: users(username)
              - column:
                  name: class_section_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_student_enrollments_class_section
                    references: class_sections(id)
              - column:
                  name: academic_year_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_student_enrollments_academic_year
                    references: academic_years(id)
              - column:
                  name: rollNumber
                  type: varchar(30)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: "ENROLLED"
                  constraints:
                    nullable: false
              - column:
                  name: enrolledAt
                  type: timestamp
