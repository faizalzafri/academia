<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Academia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f172a] text-[#f8fafc] min-h-screen font-sans">

    <!-- Header Navbar -->
    <header class="bg-[#1e293b] border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    <span class="font-bold text-lg tracking-wider text-teal-400">ACADEMIA ACADEMY</span>
                </div>
                <div class="flex gap-4">
                    <a th:href="@{/home}" 
                       class="px-4 py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg transition flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Success Alert -->
        <div th:if="${param.success}" class="mb-6 p-4 bg-emerald-950 border border-emerald-500 text-emerald-200 rounded-xl flex items-center gap-3">
            <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Profile description successfully updated!</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Left Avatar & Status Card -->
            <div class="bg-[#1e293b] border border-slate-800 p-6 rounded-2xl shadow-xl text-center space-y-4 h-fit">
                <div class="relative w-24 h-24 mx-auto bg-teal-500/10 border border-teal-500/30 text-teal-400 rounded-full flex items-center justify-center">
                    <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="absolute bottom-0 right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                
                <div>
                    <h2 class="text-xl font-bold text-white" th:text="${user.name}">John Doe</h2>
                    <span class="px-2.5 py-0.5 bg-teal-950 text-teal-400 border border-teal-900 rounded-full text-xs font-semibold uppercase tracking-wider mt-1 inline-block" 
                          th:text="${u.authorities != null and u.authorities.contains('TEACHER') ? 'Faculty' : 'Student'}">Student</span>
                </div>

                <div class="border-t border-slate-850 pt-4 text-left space-y-2 text-xs text-slate-400">
                    <div class="flex justify-between">
                        <span>Username:</span>
                        <span class="text-white font-semibold" th:text="${user.userName}">username</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Department:</span>
                        <span class="text-white font-semibold" th:text="${user.department}">Engineering</span>
                    </div>
                </div>
            </div>

            <!-- Right Detail & Edit Form Card -->
            <div class="md:col-span-2 bg-[#1e293b] border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
                <h3 class="text-lg font-bold text-white border-b border-slate-700 pb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Account Profile Details
                </h3>

                <form th:action="@{/user/account}" th:object="${user}" method="post" class="space-y-4">
                    <input type="hidden" th:field="*{userName}">
                    <input type="hidden" th:field="*{name}">
                    <input type="hidden" th:field="*{department}">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Registration Name</label>
                            <input type="text" th:value="${user.name}" class="w-full bg-[#0f172a] border border-slate-800 text-slate-400 rounded-lg p-2.5 text-sm cursor-not-allowed" disabled>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                            <input type="email" th:value="${user.email}" class="w-full bg-[#0f172a] border border-slate-800 text-slate-400 rounded-lg p-2.5 text-sm cursor-not-allowed" disabled>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Self description / Bio</label>
                        <textarea th:field="*{description}" rows="4" required
                                  class="w-full bg-[#0f172a] border border-slate-700 focus:border-teal-500 text-white p-2.5 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-teal-500 transition" 
                                  placeholder="Introduce yourself to other class members..."></textarea>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-slate-800">
                        <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-teal-500/10 flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Save Bio Profile
                        </button>
                    </div>
                </form>
            </div>

        </div>

    </main>
</body>
</html>
